[project]
name = "bloom-assistant"
version = "0.1.0"
description = "A local-first personal assistant for iMessage and the terminal"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.109.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "certifi>=2024.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "channels", "memory", "providers", "tasks", "tools", "voice"]
py-modules = ["app", "cli", "proactive"]

[project.optional-dependencies]
tasks = [
  "openai-agents>=0.8.0",
  "playwright>=1.52.0",
]
connectors = [
  "composio>=0.7.0",
]

[project.scripts]
bloom = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
